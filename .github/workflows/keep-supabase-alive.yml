name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase to prevent inactivity pause
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wiarcdovjmotruksnvaa.supabase.co/rest/v1/filesandforms?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpYXJjZG92am1vdHJ1a3NudmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyMTAwMDIsImV4cCI6MjA3Njc4NjAwMn0.Rcpuf96Xk6Ks0S4LhUy8OeRdwgoEy1V6EJL3pLrf0_U" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpYXJjZG92am1vdHJ1a3NudmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyMTAwMDIsImV4cCI6MjA3Njc4NjAwMn0.Rcpuf96Xk6Ks0S4LhUy8OeRdwgoEy1V6EJL3pLrf0_U")

          echo "Response status: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Supabase is alive."
          else
            echo "❌ Unexpected response: $response"
            exit 1
          fi
